name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: 整形・Lint・型検査・データ検証・単体テスト・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - name: 質問データの検証
        run: npm run validate:data
      - run: npm test
      - name: 分析レポートが最新か確認（データ変更時は npm run report:coverage を実行してコミット）
        run: |
          npm run report:coverage
          git diff --exit-code -- data/generated docs/phase2/coverage-report.md
      - run: npm run build

  e2e:
    name: E2E（スマホ・PC）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
